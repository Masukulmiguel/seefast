name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # undici 8 (dependencia do vitest) exige Node >= 22.19.
        # "22" resolve para a ultima 22.x (sempre >= 22.19).
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Audit (falha em high/critical)
        run: npm audit --audit-level=high

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
